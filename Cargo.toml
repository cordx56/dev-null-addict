[package]
name = "dev-null-addict"
version = "0.2.2"
edition = "2024"
description = "A /dev/null (dev-null.sh) client that opens over your shell on a key"

[dependencies]
base64 = "0.23"
clap = { version = "4.6", features = ["derive"] }
gethostname = "1.1"
getrandom = "0.4"
jiff = { version = "0.2", features = ["serde"] }
libc = "0.2"
pty-process = { version = "0.5", features = ["async"] }
ratatui = "0.30"
ratatui-textarea = "0.9"
reqwest = { version = "0.13", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
ssh-key = { version = "0.6", features = ["ed25519", "getrandom", "std"] }
terminput = "0.5"
thiserror = "2.0"
tokio = { version = "1.54", features = ["io-util", "macros", "process", "rt", "signal", "sync", "time"] }
unicode-width = "0.2"
url = { version = "2.5", features = ["serde"] }
uuid = { version = "1.28", features = ["serde"] }
vt100 = "0.18"
vte = "0.15"
